<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Match any font face and set Delugia as default -->
    <match>
        <test name="family" compare="eq">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>Delugia</string>
        </edit>
    </match>

    <match>
        <test name="family" compare="eq">
            <string>serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>Delugia</string>
        </edit>
    </match>

    <match>
        <test name="family" compare="eq">
            <string>monospace</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>Delugia</string>
        </edit>
    </match>

    <!-- Prefer Delugia over any other fonts -->
    <match>
        <edit name="family" mode="prepend" binding="strong">
            <string>Delugia</string>
        </edit>
    </match>
</fontconfig>
