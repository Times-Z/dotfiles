general {
  lock_cmd = pidof hyprlock || hyprlock 
  before_sleep_cmd = pidof hyprlock || hyprlock
  after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
  timeout    = 300
  on-timeout = ~/.config/hypr/scripts/xiaomi-lightbar-toogle
  on-resume  = ~/.config/hypr/scripts/xiaomi-lightbar-toogle
}

listener {
  timeout    = 300
  on-timeout = pidof hyprlock || hyprlock
  condition_cmd = ! command -v playerctl >/dev/null 2>&1 || ! playerctl --all-players status 2>/dev/null | grep -q '^Playing$'
  condition_retry = 30
}

listener {
  timeout    = 300
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
  condition_cmd = ! command -v playerctl >/dev/null 2>&1 || ! playerctl --all-players status 2>/dev/null | grep -q '^Playing$'
  condition_retry = 30
}
